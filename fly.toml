app = "switch402"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4020"
  HOST = "0.0.0.0"
  PUBLIC_ORIGIN = "https://switch402.fly.dev"
  DATA_DIR = "/app/data"
  PAYTO_EVM = "0xeDC5e77f1f0a2dd9Ab919687d54af2f312387A63"
  X402_FACILITATOR_URL = "https://facilitator.payai.network"

[mounts]
  source = "switch402_data"
  destination = "/app/data"

[http_service]
  internal_port = 4020
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
